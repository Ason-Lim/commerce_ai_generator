<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>발주 확인</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d211d;--ink2:#5b605a;--line:#e3e2dc;--accent:#1f6b45;--accent-s:#e7f2ec;--warn:#9a5b00;--warn-s:#fff4dc;--err:#b3261e;--err-s:#fde9e7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px}
header h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}header p{margin:0;color:var(--ink2);font-size:13.5px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}
.note{color:var(--ink2);font-size:12.5px}
label{font-weight:600;font-size:14px}
input,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
input.code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase;max-width:220px}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:10px 20px;background:var(--ink);color:#fff;cursor:pointer}
button[disabled]{opacity:.5;cursor:default}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:12px}
.item{position:relative;display:flex;flex-direction:column;border:2px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;cursor:pointer}
.item input{position:absolute;opacity:0}
.item:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-s)}
.item:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.item img,.item .ph{width:100%;aspect-ratio:4/3;object-fit:cover;background:#eeede7}
.item .t{padding:10px 12px}.item b{display:block;font-size:15px}.item small{display:block;color:var(--ink2);font-size:12.5px;margin-top:2px}
.tier{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-s);border-radius:999px;padding:1px 8px;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.field{display:grid;gap:4px;margin-top:10px}
.consent{background:#f4f6f3;border-radius:12px;padding:12px;font-size:13px;margin-top:12px}
.consent table{border-collapse:collapse;width:100%;margin:6px 0}.consent td{border-top:1px solid var(--line);padding:4px 6px;vertical-align:top}
.consent td:first-child{color:var(--ink2);width:28%;white-space:nowrap}
.msg{border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14px}
.msg.ok{background:var(--accent-s)}.msg.err{background:var(--err-s);color:var(--err)}.msg.info{background:var(--warn-s);color:var(--warn)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
footer{margin-top:28px;color:var(--ink2);font-size:12px;line-height:1.7}
table.t{width:100%;border-collapse:collapse;font-size:14px}table.t th,table.t td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
table.t td.num,table.t th.num{text-align:right}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}.kpi span{display:block;font-size:12.5px;color:var(--ink2)}.kpi b{font-size:22px}
select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<main>
  <header><h1 id="title">발주 확인</h1><p>발주서를 받으셨으면 아래에서 '발주 확인'을 눌러 주세요. 이 링크는 다른 사람과 나누지 마세요.</p></header>
  <div id="gate" class="box"><p class="note" id="gateMsg">발주 담당자에게 받은 링크로 들어와 주세요.</p></div>
  <div id="body" hidden>
    <section class="box" aria-labelledby="po-h">
      <h2 id="po-h" style="font-size:17px;margin:0">발주서</h2>
      <table class="t" style="margin-top:8px"><tbody id="info"></tbody></table>
      <table class="t" style="margin-top:12px"><thead><tr><th>상품</th><th>품번</th><th class="num">수량</th><th class="num">단가</th><th class="num">금액</th></tr></thead><tbody id="lines"></tbody></table>
      <table class="t" style="margin-top:8px"><tbody id="sum"></tbody></table>
      <p class="note">배송 정보는 발주서 파일에만 있어요. 이 화면에는 보이지 않아요. 파일은 발주일부터 30일까지 받을 수 있고, 배송이 끝나면 파기해 주세요.</p>
      <div class="row"><button type="button" id="fileBtn">발주서·배송 목록 파일 받기</button></div>
      <div id="fileMsg" role="status"></div>
    </section>
    <section class="box" aria-labelledby="ack-h">
      <h2 id="ack-h" style="font-size:17px;margin:0">발주 확인</h2>
      <p class="note" id="ackState"></p>
      <form id="ackForm">
        <div class="field"><label for="a_name">확인하시는 분 (이름 또는 부서)</label><input id="a_name" maxlength="30" autocomplete="organization-title"></div>
        <div class="field"><label for="a_date">출고 예정일 (선택)</label><input id="a_date" type="date"></div>
        <div class="field"><label for="a_memo">메모 (선택 — 품절·납기 변경 등)</label><textarea id="a_memo" rows="2" maxlength="300"></textarea></div>
        <div class="row"><button type="submit" id="ackBtn">발주 확인</button></div>
        <div id="ackMsg" role="status" aria-live="polite"></div>
      </form>
    </section>
  </div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won = (v) => v == null ? "단가 확인 필요" : Number(v).toLocaleString() + "원";
const poNo = decodeURIComponent(location.pathname.split("/")[3] || "");
let KEY = "";
function msg(el, text, kind) { el.innerHTML = `<div class="msg ${kind}">${esc(text)}</div>`; }
async function post(path, body) {
  const r = await fetch(`/corp/api/po/${encodeURIComponent(poNo)}/${path}`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const d = await r.json().catch(() => ({}));
  if (!d.ok) throw new Error(d.error || "잠시 후 다시 해 주세요");
  return d;
}
function draw(d) {
  const p = d.po, o = d.orderer || {};
  $("#gate").hidden = true; $("#body").hidden = false;
  $("#title").textContent = `발주 확인 · ${p.po_no}`;
  const rows = [["발주 번호", p.po_no], ["발주일", (p.issued_at || "").slice(0, 10)], ["발주사", o.name || "-"], ["공급사", p.supplier],
    ["납기(출고)", p.due_date || "협의"], ["결제 조건", p.payment_terms || "협의"], ["단가 기준", p.vat_mode === "included" ? "부가세 포함" : "부가세 별도"]];
  $("#info").innerHTML = rows.map(([a, b]) => `<tr><th style="width:120px">${esc(a)}</th><td>${esc(b)}</td></tr>`).join("");
  $("#lines").innerHTML = p.lines.map((l) => `<tr><td>${esc(l.name || l.item_id)}</td><td>${esc(l.sku || "")}</td><td class="num">${l.qty}</td><td class="num">${esc(won(l.unit_cost))}</td><td class="num">${l.amount == null ? "" : esc(won(l.amount))}</td></tr>`).join("");
  $("#sum").innerHTML = [["공급가액", p.supply_amount], ["부가세", p.vat], ["합계", p.total]].map(([a, v]) => `<tr><th>${a}</th><td class="num">${esc(won(v))}</td></tr>`).join("");
  $("#ackState").textContent = p.status === "acknowledged" ? `${(p.ack_at || "").slice(0, 16).replace("T", " ")}에 ${p.ack_by}님이 확인했어요. 출고 예정일·메모를 고치려면 다시 눌러 주세요.` : "아직 확인 전이에요.";
  if (p.ack_ship_date) $("#a_date").value = p.ack_ship_date;
}
$("#fileBtn").addEventListener("click", async () => {
  $("#fileBtn").disabled = true;
  try {
    const r = await fetch(`/corp/api/po/${encodeURIComponent(poNo)}/file`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({key: KEY})});
    if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.error || "파일을 받지 못했어요"); }
    const cd = r.headers.get("Content-Disposition") || "";
    const name = decodeURIComponent((cd.match(/filename\*=UTF-8''([^;]+)/) || [])[1] || "po.xlsx");
    const a = document.createElement("a"); a.href = URL.createObjectURL(await r.blob()); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  } catch (err) { msg($("#fileMsg"), err.message, "err"); }
  finally { $("#fileBtn").disabled = false; }
});
$("#ackForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("#ackBtn").disabled = true;
  try {
    const d = await post("ack", {key: KEY, name: $("#a_name").value.trim(), ship_date: $("#a_date").value || null, memo: $("#a_memo").value.trim()});
    draw(d); msg($("#ackMsg"), "확인했어요. 고맙습니다.", "ok");
  } catch (err) { msg($("#ackMsg"), err.message, "err"); }
  finally { $("#ackBtn").disabled = false; }
});
const h = new URLSearchParams(location.hash.slice(1));
KEY = h.get("k") || "";
try { if (KEY) sessionStorage.setItem("po:" + poNo, KEY); else KEY = sessionStorage.getItem("po:" + poNo) || ""; } catch {}
history.replaceState(null, "", location.pathname);
if (KEY) post("view", {key: KEY}).then(draw).catch((err) => msg($("#gateMsg"), err.message, "err"));
</script>
</body>
</html>
