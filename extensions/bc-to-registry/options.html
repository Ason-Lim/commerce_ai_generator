<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>등록부 저장 — 설정</title>
<style>
  body { font: 14px/1.6 -apple-system, "Apple SD Gothic Neo", sans-serif; max-width: 560px; margin: 32px auto; color: #222; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; }
  input { width: 100%; padding: 6px 8px; font: inherit; box-sizing: border-box; }
  button { margin-top: 16px; padding: 6px 16px; font: inherit; }
  .note { color: #607d8b; font-size: 13px; }
  #status { margin-left: 10px; }
  .err { color: #c62828; } .ok { color: #2e7d32; }
</style>
</head>
<body>
<h2>commerce_ai 등록부 저장 — 설정</h2>
<label for="server">서버 주소</label>
<input id="server" placeholder="http://localhost:8001">
<p class="note">이 컴퓨터에서 도는 commerce_ai(8001)만 쓸 수 있어요. 공개 주소는 막아 두었어요.</p>
<label for="token">관리자 토큰</label>
<input id="token" type="password" autocomplete="off" placeholder="저장된 토큰은 보여 주지 않아요">
<p class="note">비워 두고 저장하면 지금 토큰을 그대로 둡니다. 토큰은 이 브라우저(chrome.storage.local)에만 저장돼요.</p>
<button id="save">저장</button><button id="test">연결 확인</button><span id="status"></span>
<script src="lib/registry_row.js"></script>
<script src="options.js"></script>
</body>
</html>
